<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Incredible India · Dark Atlas</title>
<style>
:root{color-scheme:dark;--bg:#050505;--s:#0d0d0f;--b:#1f1f24;--t:#ececf1;--m:#8a8a96;--H:#f5b942;--S:#c084fc;--M:#5eead4;--N:#86efac;--B:#60a5fa;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--t);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden}
#app{display:grid;grid-template-columns:1fr 380px;height:100%}
#mapw{position:relative;overflow:hidden;background:radial-gradient(ellipse at 40% 50%,#0b0b0e,#030303)}
#mapw{perspective:1600px}
header,.zoom,#count{z-index:10}
#plane{position:absolute;left:50%;top:50%;transform-style:preserve-3d;transform:translate(-50%,-48%) rotateX(var(--rx,34deg)) rotateZ(var(--rz,0deg));transition:transform .3s ease-out;background:#07070a;box-shadow:0 0 0 1px #1b1b22}
#plane::before{content:"";position:absolute;inset:4%;background:#000;filter:blur(30px);transform:translateZ(-40px)}
svg{position:absolute;inset:0;width:100%;height:100%;cursor:grab;display:block;touch-action:none;transform:translateZ(1px)}svg:active{cursor:grabbing}
#pins{position:absolute;inset:0;transform-style:preserve-3d;pointer-events:none}
.land{fill:#15151b;stroke:#4a4a5a;stroke-width:1.3;filter:drop-shadow(0 0 5px #2b2b44)}
.isl{fill:#15151b;stroke:#4a4a5a;stroke-width:.8}.il{fill:none;stroke:#2a2a33;stroke-width:3;stroke-linecap:round;stroke-dasharray:7 2}
.grat{stroke:#14141a;stroke-width:.6;fill:none}.riv{fill:none;stroke:#2f7fb5;stroke-width:1;opacity:.6}
.rdg{fill:none;stroke:#555566;stroke-width:3;stroke-dasharray:.1 5;stroke-linecap:round}
.lbl{fill:#33333d;font-size:8px;letter-spacing:.3em;text-transform:uppercase;pointer-events:none}
.rt{fill:none;stroke:#fff;stroke-width:1.5;stroke-dasharray:6 5;animation:fl 1s linear infinite;filter:drop-shadow(0 0 4px #fff)}@keyframes fl{to{stroke-dashoffset:-11}}
.pin{--h:26px;position:absolute;width:0;height:0;pointer-events:auto;cursor:pointer;transform-style:preserve-3d;transform-origin:50% 100%;transform:translateZ(2px) rotateX(calc(var(--rx,34deg)*-1));transition:transform .3s ease-out;animation:in .7s both}
@keyframes in{from{opacity:0}}
.pin:hover{--h:44px;z-index:5}.pin.sel{--h:58px;z-index:6}
.stem{position:absolute;left:-9px;bottom:0;width:2px;padding:0 8px;box-sizing:content-box;background:linear-gradient(to top,transparent,var(--c));background-clip:content-box;height:var(--h);transition:height .25s}
.dot{position:absolute;left:-5px;bottom:var(--h);width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 12px var(--c),0 0 28px var(--c);transition:bottom .25s,transform .25s}
.pin:hover .dot,.pin.sel .dot{transform:scale(1.5);background:#fff}
.pin:hover::after,.pin.sel::after{content:"";position:absolute;left:-16px;top:-16px;width:32px;height:32px;border-radius:50%;border:1px solid var(--c);animation:pu 1.4s infinite}
@keyframes pu{from{transform:rotateX(var(--rx,34deg)) scale(.3);opacity:1}to{transform:rotateX(var(--rx,34deg)) scale(1.6);opacity:0}}
.nm{position:absolute;bottom:calc(var(--h) + 12px);left:0;transform:translateX(-50%);white-space:nowrap;font-size:11px;color:#c4c4cc;text-shadow:0 0 6px #000;display:none;pointer-events:none}.zm .nm,.pin:hover .nm,.pin.sel .nm{display:block}
.nb{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}.nb span{border:1px solid var(--b);border-radius:999px;padding:5px 10px;font-size:12px;color:var(--m);cursor:pointer}.nb span:hover{color:var(--t);border-color:#444}
.trip{margin-top:20px;padding:14px;border:1px solid #2a2a31;border-radius:12px;font-size:13px;line-height:1.7;color:var(--m)}.trip b{color:var(--t)}.trip span{color:var(--t);text-decoration:underline;cursor:pointer}

header{position:absolute;top:14px;left:18px;right:18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;pointer-events:none}
header>*{pointer-events:auto}
h1{font-size:15px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;margin:0 8px 0 0}h1 span{color:var(--m);font-weight:400}
input{background:var(--s);border:1px solid var(--b);color:var(--t);padding:9px 14px;border-radius:999px;font-size:13px;outline:none;width:210px}
input:focus{border-color:#444}
.chip{background:var(--s);border:1px solid var(--b);color:var(--m);padding:7px 12px;border-radius:999px;font-size:12px;cursor:pointer;display:flex;gap:7px;align-items:center}
.chip i{width:8px;height:8px;border-radius:50%;display:block}.chip.on{color:var(--t);border-color:#3a3a42}
.zoom{position:absolute;left:18px;bottom:18px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:36px;height:36px;border-radius:10px;background:var(--s);border:1px solid var(--b);color:var(--t);font-size:18px;cursor:pointer}
#count{position:absolute;left:70px;bottom:26px;color:var(--m);font-size:12px}
#tip{position:fixed;pointer-events:none;background:#000;border:1px solid var(--b);padding:5px 10px;border-radius:8px;font-size:12px;opacity:0;transition:opacity .1s;z-index:9}
aside{background:var(--s);border-left:1px solid var(--b);padding:28px 26px;overflow:auto}
.tag{display:inline-block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;padding:4px 10px;border-radius:999px;border:1px solid currentColor}
aside h2{font-size:28px;margin:16px 0 4px;font-weight:600}.st{color:var(--m);font-size:13px;margin-bottom:18px}
.desc{line-height:1.7;color:#c9c9d1;font-size:15px}
.row{display:flex;justify-content:space-between;border-top:1px solid var(--b);padding:12px 0;font-size:13px;color:var(--m)}.row b{color:var(--t);font-weight:500}
.go{display:block;width:100%;text-align:center;margin-top:12px;padding:12px;border:1px solid #333;border-radius:12px;background:none;color:var(--t);text-decoration:none;font:inherit;font-size:13px;cursor:pointer}.go:hover{background:#17171b}
.hint{color:var(--m);line-height:1.7;font-size:14px}
.nbr{fill:#0b0b0e;stroke:#1d1d25;stroke-width:.7;vector-effect:non-scaling-stroke}
.stt{fill:var(--f);stroke:#33333f;stroke-width:.6;vector-effect:non-scaling-stroke;cursor:pointer;transition:fill .15s}.stt:hover{fill:#26263a}.stt.on{fill:#2b2b48}
.dst{display:none;fill:none;stroke:#262631;stroke-width:.4;vector-effect:non-scaling-stroke;pointer-events:none}.zs .dst{display:block}
.out{fill:none;stroke:#8f8fb8;stroke-width:1.3;vector-effect:non-scaling-stroke;filter:drop-shadow(0 0 5px #5a5ad0);pointer-events:none}
.riv{vector-effect:non-scaling-stroke;pointer-events:none;stroke-linecap:round}
.cl{fill:#2e2e39;font-size:8px;letter-spacing:.4em;text-transform:uppercase;pointer-events:none}
.sl{fill:#70708a;font-size:5.2px;letter-spacing:.1em;text-transform:uppercase;pointer-events:none;opacity:0;transition:opacity .3s}.zs .sl{opacity:1}
.chip:empty{display:none}

#app{grid-template-columns:1fr 410px}aside{padding:0}
aside>.tag,aside>h2,aside>.hint{margin-left:26px;margin-right:26px}aside>.tag{display:inline-block;margin-top:26px}
.hero{padding:26px 26px 18px;background:radial-gradient(circle at 15% 0%,color-mix(in srgb,var(--c) 26%,transparent),transparent 65%);border-bottom:1px solid var(--b)}.hero h2{margin:10px 0 4px}.hr{float:right;cursor:pointer;font-size:24px;color:var(--c)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:16px 26px 0}.stat{background:#111115;border:1px solid var(--b);border-radius:12px;padding:10px}.stat small{display:block;color:var(--m);font-size:10px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:3px}.stat b{font-size:13px;font-weight:600}
.acts{display:flex;gap:8px;padding:12px 26px 0}.bt{flex:1;padding:10px;border:1px solid #2a2a31;border-radius:10px;background:none;color:var(--t);font:inherit;font-size:12px;cursor:pointer;text-align:center;text-decoration:none;display:block}.bt:hover{background:#17171b}.bt.on{border-color:var(--c);color:var(--c)}
.tabs{display:flex;gap:4px;padding:14px 26px 0;border-bottom:1px solid var(--b)}.tabs span{padding:8px 12px;font-size:13px;color:var(--m);cursor:pointer;border-bottom:2px solid transparent}.tabs span.on{color:var(--t);border-color:var(--c)}
.body{padding:6px 26px 28px}.sec{margin:18px 0 8px;color:var(--m);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.ck{display:flex;gap:10px;align-items:center;padding:9px 12px;border:1px solid var(--b);border-radius:10px;margin-bottom:6px;font-size:14px;cursor:pointer;color:#c9c9d1}.ck input{accent-color:var(--c)}
.tipbox{margin-top:14px;padding:12px 14px;border-radius:12px;background:#111115;border-left:2px solid var(--c);font-size:13px;line-height:1.6;color:#c9c9d1}
.months{display:grid;grid-template-columns:repeat(12,1fr);gap:4px}.mo{height:34px;border-radius:6px;background:#111115;color:#555;font-size:10px;display:flex;align-items:center;justify-content:center}.mo.best{background:color-mix(in srgb,var(--c) 30%,#0d0d0f);color:var(--t)}.mo.now{outline:1px solid #fff}
.dist{display:grid;grid-template-columns:72px 1fr 70px;gap:8px;align-items:center;font-size:12px;color:var(--m);margin:8px 0}.bar{height:5px;border-radius:3px;background:#17171c}.bar i{display:block;height:100%;border-radius:3px;background:var(--c)}
.nbc{display:flex;justify-content:space-between;align-items:center;padding:11px 12px;border:1px solid var(--b);border-radius:10px;margin-bottom:6px;font-size:14px;cursor:pointer}.nbc:hover{background:#111115}.nbc small{color:var(--m)}
.pin.fv .dot{box-shadow:0 0 0 2px #fff,0 0 14px var(--c)}

@media(max-width:820px){#app{grid-template-columns:1fr;grid-template-rows:62% 38%}aside{border-left:0;border-top:1px solid var(--b);padding:18px}aside h2{font-size:22px}input{width:150px}h1 span{display:none}}
</style></head><body>
<div id="app">
<div id="mapw">
<div id="plane"><svg id="svg" viewBox="0 0 680 780" preserveAspectRatio="none"></svg><div id="pins"></div></div>
<header><h1>India <span>· Dark Atlas</span></h1><input id="q" placeholder="Search a place…"><div id="chips" style="display:flex;gap:6px;flex-wrap:wrap"></div></header>
<div class="zoom"><button id="zi">+</button><button id="zo">−</button><button id="zr">⟲</button></div><div id="count"></div>
</div>
<aside id="side"><p class="tag" style="color:var(--m)">Explore</p><h2>Pick a pin</h2><p class="hint">Tap any glowing point on the map to read about the place. Drag to pan, scroll to zoom and move the mouse to tilt the 3D board. Pins fly you in on click, Enter in search jumps to a match, and you can add stops to plan a trip route.</p></aside>
</div><div id="tip"></div>
